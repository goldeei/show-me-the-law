services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      # Must match the user/password/db embedded in DATABASE_URL below — Postgres's
      # image needs these as discrete vars, so they're duplicated, not derived.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-show_me_the_law}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  valkey:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - valkey_data:/data

volumes:
  postgres_data:
  valkey_data:
